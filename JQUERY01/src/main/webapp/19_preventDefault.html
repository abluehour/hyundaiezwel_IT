<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>preventDefault()</title>
		<link rel="icon" type="image/png" href="#" />
		<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
		<script type="text/javascript">
			// 문서(document)가 준비 완료되면 함수 실행 
			$(document).ready(function() {
				// <a> 태그 클릭 시
				$('#link').on('click', function(e) {
					// 1. 기본 동작(링크 이동)을 중지시킴
					event.preventDefault(); 
					
					// 2. 알림창 출력
					alert("링크 이동이 중지되었습니다.");
				});
				
				// 문서 상에서 오른쪽 마우스 클릭했을 때 기본으로 출력되는 팝업메뉴 차단 
				$(document).on('contextmenu', function(e) {
					// 브라우저의 기본 컨텍스트 메뉴 동작을 막음
					event.preventDefault(); 
					alert("오른쪽 마우스 클릭은 사용할 수 없습니다.");
				});
			});
		</script>
	</head>
	<body>
		<a href="https://www.naver.com" id="link">네이버로 이동</a>
	</body>
</html>
