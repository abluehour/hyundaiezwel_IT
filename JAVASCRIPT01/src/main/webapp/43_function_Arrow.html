<!DOCTYPE html>
<html>
   <head>
      <meta charset="UTF-8">
      <title>Insert title here</title>
      <script type="text/javascript">   
      	// 화살표 함수 선언 형식
      	// function 키워드 대신에 화살표(=>)사용하여 보다 간략한 방법으로 함수 선언
      	// 모든 경우 사용 가능한 것은 아님
      	
      	// 문법
      	// 자료형 변수명 = () => {함수 코드 블럭} // 매개변수가 없는 경우
      	// x => {함수 코드 블럭} //매개변수가 한개인 경우, 소괄호 생략가능
      	// (x,y) => {함수 코드 블럭} //매개변수가 여러개 있는 경우
      	
      	// 함수 코드 블럭
      	// x => x*x; //함수 코드 블럭이 한줄 구문인 경우(괄호 모두 생략 가능)
      	
      	let sayHi = () => alert(`안녕하세요`); //화살표 함수 형식을 사용해서 선언한 익명함수
      	let sayHi2 = function(){alert(`안녕하세요2`)}; //둘다 같은 함수
      	
      	sayHi();
      	sayHi2();
      	
      	let number = [1,2,3,4,5];
      	
      	//화살표 함수를 골백함수로 전달박은 forEach메서드(함수)를 사용예제
      	number.forEach(x=>{
      		console.log(x*2);
      	});
      </script>
   </head>
   <body>
   
   </body>
</html>
