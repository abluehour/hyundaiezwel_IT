<!DOCTYPE html>
<html>
   <head>
      <meta charset="UTF-8">
      <title>Insert title here</title>
      <script type="text/javascript">   
      	//비동기 진행하는 자바그크립트 함수 활용 비동기방식으로 콜백함수 사용 예제
      	
      	let callback =()=>{
      		console.log(`콜백함수 호출됨`);
      	}
      	
      	
      	console.log(`콜백함수 호출 전`);
      	setTimeout(callback,3000); //3초 후에 전당받은 callback 함수를 실행시켜줌 - 함수 종료전에 아래 코드들이 실행가능하면 실행하게 됨
      	//setTimeout 함수 호출함녀서 callback 익명함수 인수로 전당 = setTimeout 함수는 함수를 콜백으로 전달 받아서 지정된 시간 이후에 함수를 실행 시켜줌
      	console.log(`콜백함수 호출 후`);
      	
      	//콜백함수를 사용할 때 콜백 함수 전달된 함수 내에서 또 콜백 함수를 전달이 반복되게 되면 콜백지옥에 빠질 수 있습니다.
      	//코드 가독성이 떨어져서 수정하기 어려울 수 있음 -> async/await 기능을 주로 사용하기도 함
      </script>
   </head>
   <body>
   
   </body>
</html>
