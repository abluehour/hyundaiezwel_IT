<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>setInterval 연습문제</title>
		<script type="text/javascript">	
			let count = 0;

			function start(){
				alert("이미지 10개 출력");
				let timerID = setInterval('showImg()', 1000);
				}  
			
			function showImg(){
				if (count >= 10){
					clearInterval(timerID);
				} else {
						if (count % 2 == 0){
							document.write("<img src='image/apple.png'>");
						} else{
							document.write("<img src='image/bomb.png'>");
					}
					count++;
				}
			}
		</script>
	</head>
	<body onLoad="start()">
	
	</body>
</html>
